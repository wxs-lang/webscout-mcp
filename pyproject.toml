[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webscout-mcp"
version = "0.5.0"
description = "AI-powered web intelligence platform: search, fetch, crawl, extract, understand, and monitor the web with built-in AI, vector search, browser automation, and alerting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "webscout-mcp contributors"},
]
maintainers = [
    {name = "wxs-lang", email = "393456156@qq.com"},
]
keywords = ["mcp", "model-context-protocol", "web-search", "web-scraping", "ai-agent", "caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.6.0",
    "readability-lxml>=0.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/wxs-lang/webscout-mcp"
Repository = "https://github.com/wxs-lang/webscout-mcp.git"
Documentation = "https://github.com/wxs-lang/webscout-mcp#readme"
Issues = "https://github.com/wxs-lang/webscout-mcp/issues"
Changelog = "https://github.com/wxs-lang/webscout-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
browser = [
    "playwright>=1.40.0",
]
vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
ai = [
    "openai>=1.0.0",
]
monitor = [
    "psutil>=5.9.0",
]
all = [
    "playwright>=1.40.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "psutil>=5.9.0",
    "html2text>=2020.1.16",
]

[project.scripts]
webscout-mcp = "webscout_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["webscout_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv/", "build/", "dist/"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "venv/|build/|dist/"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["webscout_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv/", "build/", "dist/"]

[tool.ruff.lint]
# Ignore rules that are too strict or don't apply to this project
ignore = [
    "BLE001",  # Blind exception catch - common in web scraping
    "S110",    # try-except-pass - common in web scraping
    "RUF012",  # Mutable class variables - common in dataclasses
    "RUF022",  # Non-self-cls method - utility methods
    "RUF059",  # Unpacked variable never used - common in tests
    "SIM102",  # Collapsible if - readability preference
    "SIM103",  # Return boolean condition - readability preference
    "PLR1730", # Private function referenced - utility functions
    "PERF102", # Validate data classes - performance
    "FURB161", # Use math.prod - compatibility
    "DTZ003",  # Naive datetime - common in web scraping
    "DTZ005",  # Datetime.now() without timezone - common
    "DTZ006",  # Naive datetime - common
    "PLW1510", # Use sys.exit - common
    "PYI034",  # Use list instead of List - typing preference
    "PYI036",  # Use set instead of Set - typing preference
    "B017",    # Trivial assert - common in tests
    "UP036",   # Use builtins - compatibility
    "C401",    # Use generator - readability
    "SIM118",  # Use key in dict - readability
    "RUF013",  # Type alias - typing preference
    "RUF015",  # Prefer next(iter()) - readability
    "RUF100",  # Unused noqa - will fix manually
    "F402",    # Import shadowed by loop variable - common pattern
]

[tool.ruff.lint.per-file-ignores]
# Test files can be more lenient
"tests/*.py" = [
    "F401",   # Unused import - common in tests
    "F841",   # Unused variable - common in tests
    "F821",   # Undefined name - common in tests
    "RUF059", # Unpacked variable never used - common in tests
    "S101",   # Use assert - that's what tests do
]

# Experimental modules can be more lenient
"webscout_mcp/extras/*.py" = [
    "F401",   # Unused import
    "F841",   # Unused variable
    "F402",   # Import shadowed by loop variable
]

# Non-core modules - will be cleaned up gradually
"webscout_mcp/health.py" = ["F401", "F841", "F821"]
"webscout_mcp/data_exporter.py" = ["F401", "F841", "F821", "I001"]
"webscout_mcp/api_server.py" = ["F401", "F841", "F402"]
"webscout_mcp/pdf_processor.py" = ["F401", "F841", "F402"]
"webscout_mcp/vector_store.py" = ["F401", "F841"]
"webscout_mcp/search_optimizer.py" = ["F401", "I001", "F841"]
"webscout_mcp/data_cleaner.py" = ["F401", "F841", "I001"]
"webscout_mcp/browser_fetcher.py" = ["F401", "F841"]
"webscout_mcp/tls_fetcher.py" = ["F401"]
"webscout_mcp/setup.py" = ["F401", "F841"]
"webscout_mcp/server.py" = ["F841"]

[tool.bandit]
# Bandit security scanning configuration
exclude_dirs = ["tests", "venv", "build", "dist", ".github"]
# Skip rules that are false positives for this project:
# B324: MD5 used for non-security purposes (ID generation, caching)
# B101: assert used in tests (excluded anyway)
# B404: subprocess import (legitimate for browser automation)
# B603/B607: subprocess calls (legitimate for browser automation)
skips = ["B324", "B101", "B404", "B603", "B607"]
