name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README_zh.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install documentation dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python] mike
          pip install -e .

      - name: Generate API documentation
        run: |
          # Create docs directory if it doesn't exist
          mkdir -p docs/api

          # Generate API documentation from docstrings
          cat > docs/api/index.md << 'EOF'
          # API Reference

          ## Modules

          EOF

          # List all modules
          for module in webscout_mcp/*.py; do
            module_name=$(basename "$module" .py)
            if [ "$module_name" != "__init__" ]; then
              echo "- [${module_name}](api/${module_name}.md)" >> docs/api/index.md

              # Create module documentation
              cat > "docs/api/${module_name}.md" << EOF
          # ${module_name}

          ::: webscout_mcp.${module_name}
              options:
                show_source: true
                heading_level: 3
          EOF
            fi
          done

      - name: Build documentation with mkdocs
        run: |
          # Create mkdocs.yml if it doesn't exist
          if [ ! -f mkdocs.yml ]; then
            cat > mkdocs.yml << 'EOF'
          site_name: webscout-mcp
          site_description: AI-powered web intelligence platform for AI agents
          site_author: wxs-lang
          site_url: https://wxs-lang.github.io/webscout-mcp/

          theme:
            name: material
            features:
              - navigation.tabs
              - navigation.sections
              - navigation.expand
              - navigation.top
              - search.suggest
              - search.highlight
              - content.tabs.link
              - content.code.annotation
              - content.code.copy
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/weather-night
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/weather-sunny
                  name: Switch to light mode

          plugins:
            - search
            - mkdocstrings:
                default_handler: python
                handlers:
                  python:
                    options:
                      show_source: true
                      show_root_heading: true
                      show_object_full_path: false
                      show_category_heading: true
                      group_by_category: true
                      heading_level: 3

          markdown_extensions:
            - admonition
            - pymdownx.details
            - pymdownx.superfences
            - pymdownx.highlight:
                anchor_linenums: true
            - pymdownx.inlinehilite
            - pymdownx.snippets
            - pymdownx.tabbed:
                alternate_style: true
            - toc:
                permalink: true

          nav:
            - Home: index.md
            - Getting Started:
              - Installation: getting-started/installation.md
              - Quick Start: getting-started/quickstart.md
              - Configuration: getting-started/configuration.md
            - Usage:
              - Search: usage/search.md
              - Content Extraction: usage/extraction.md
              - AI Understanding: usage/ai.md
              - Browser Automation: usage/browser.md
              - Monitoring: usage/monitoring.md
            - API Reference: api/index.md
            - Contributing: contributing.md
            - Changelog: changelog.md
          EOF
          fi

          # Create docs directory structure
          mkdir -p docs/getting-started docs/usage

          # Create index.md from README
          if [ -f README.md ]; then
            cp README.md docs/index.md
          fi

          # Create getting started docs
          cat > docs/getting-started/installation.md << 'EOF'
          # Installation

          ## Prerequisites

          - Python 3.10 or higher
          - pip

          ## Install via pip

          ```bash
          pip install webscout-mcp
          ```

          ## Install from source

          ```bash
          git clone https://github.com/wxs-lang/webscout-mcp.git
          cd webscout-mcp
          pip install -e .
          ```

          ## Docker

          ```bash
          docker pull ghcr.io/wxs-lang/webscout-mcp:latest
          ```
          EOF

          cat > docs/getting-started/quickstart.md << 'EOF'
          # Quick Start

          ## Basic Usage

          ```python
          from webscout_mcp import WebScoutMCP

          # Initialize the MCP server
          server = WebScoutMCP()

          # Search the web
          results = server.search("web scraping with AI")
          print(results)
          ```

          ## MCP Client Configuration

          Add to your MCP client configuration:

          ```json
          {
            "mcpServers": {
              "webscout": {
                "command": "python",
                "args": ["-m", "webscout_mcp"]
              }
            }
          }
          ```
          EOF

          # Build the documentation
          mkdocs build --site-dir site

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 📚 Documentation Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
