name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: |
          ruff check webscout_mcp/ tests/ \
            --output-format=github

      - name: Run ruff format check
        run: |
          ruff format --check webscout_mcp/ tests/

      - name: Check documentation is up-to-date
        run: |
          python scripts/generate_docs.py --check
          git diff --exit-code MODULE_STATUS.md docs/tools.md

      - name: Upload ruff results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-results
          path: |
            ruff-results.sarif
          retention-days: 14

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install mypy

      - name: Run mypy type check
        run: |
          mypy webscout_mcp/ \
            --ignore-missing-imports \
            --warn-unused-ignores \
            --warn-redundant-casts \
            --no-strict-optional \
            --xml-report mypy-results \
            2>&1 | tee mypy_output.txt

      - name: Upload mypy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-results
          path: |
            mypy_output.txt
            mypy-results/
          retention-days: 14

  security-scan:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          set -o pipefail
          echo "=== Bandit version ==="
          bandit --version
          echo ""
          echo "=== Running bandit ==="
          bandit -r webscout_mcp/ \
            -f json \
            -o bandit-results.json \
            -ll \
            2>&1 | tee bandit_output.txt
          BANDIT_EXIT=$?
          echo ""
          echo "=== Bandit exit code: $BANDIT_EXIT ==="
          echo ""
          echo "=== Bandit results summary ==="
          if [ -f bandit-results.json ]; then
            python3 -c "
          import json
          with open('bandit-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          print(f'Total issues: {len(results)}')
          for r in results:
              print(f'  [{r[\"issue_severity\"]}] {r[\"test_id\"]}: {r[\"issue_text\"][:100]}')
              print(f'    Location: {r[\"filename\"]}:{r[\"line_number\"]}')
          "
          fi
          exit $BANDIT_EXIT

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: |
            bandit-results.json
            bandit_output.txt
          retention-days: 14

      - name: Security summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-results.json ]; then
            python -c "
          import json
          with open('bandit-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          metrics = data.get('metrics', {}).get('_totals', {})
          print(f'- Total issues found: {len(results)}')
          print(f'- High severity: {metrics.get(\"SEVERITY.HIGH\", {}).get(\"count\", 0)}')
          print(f'- Medium severity: {metrics.get(\"SEVERITY.MEDIUM\", {}).get(\"count\", 0)}')
          print(f'- Low severity: {metrics.get(\"SEVERITY.LOW\", {}).get(\"count\", 0)}')
          " >> $GITHUB_STEP_SUMMARY
          fi

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, security-scan, codeql]
    if: always()
    steps:
      - name: Quality check summary
        run: |
          echo "## Code Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (ruff) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check (mypy) | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan (bandit) | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
