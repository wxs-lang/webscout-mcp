name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install core dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest pytest-asyncio

      - name: Install mcp (optional)
        run: pip install mcp || echo "mcp install failed, continuing"

      - name: Install project
        run: pip install -e . --no-deps || echo "project install failed, continuing"

      - name: Run tests and save output
        run: |
          set +e
          echo "=== PYTHON VERSION ==="
          python --version
          echo "=== PIP LIST ==="
          pip list
          echo "=== RUNNING TESTS ==="
          pytest tests/ -v --tb=long > test_output.txt 2>&1
          EXIT_CODE=$?
          echo "=== TEST EXIT CODE: $EXIT_CODE ===" >> test_output.txt
          cat test_output.txt
          exit $EXIT_CODE

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt
