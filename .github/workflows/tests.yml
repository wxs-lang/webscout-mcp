name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest pytest-asyncio
          pip install mcp || true
          pip install -e . --no-deps

      - name: Run TestConfig
        run: pytest tests/test_basic.py::TestConfig -v --tb=long

      - name: Run TestCache
        run: pytest tests/test_basic.py::TestCache -v --tb=long

      - name: Run TestUtils
        run: pytest tests/test_basic.py::TestUtils -v --tb=long

      - name: Run TestExtractor
        run: pytest tests/test_basic.py::TestExtractor -v --tb=long

      - name: Run TestServer
        run: pytest tests/test_basic.py::TestServer -v --tb=long
