name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install all dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest
          pip install mcp || true
          pip install -e .

      - name: Debug - show environment
        run: |
          python --version
          pip list
          python -c "import webscout_mcp; print('webscout_mcp version:', webscout_mcp.__version__)"

      - name: Debug - collect tests only
        run: python -m pytest tests/ --collect-only -q 2>&1 | head -100

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=long 2>&1 | tee test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt
