name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.12"]
      max-parallel: 1
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pytest-cov pytest-mock

      - name: Lint with ruff
        run: ruff check webscout_mcp/ tests/
        continue-on-error: true

      - name: Type check with mypy
        run: mypy webscout_mcp/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests (skip e2e network tests)
        run: |
          pytest -m "not e2e" --cov=webscout_mcp --cov-report=xml --cov-report=term-missing -v
        env:
          WEBSCOUT_CI_MODE: "1"
          PYTHONUNBUFFERED: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
