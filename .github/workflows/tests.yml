name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install all dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest pytest-asyncio
          pip install mcp || true
          pip install -e .

      - name: Run test_v2.py only (no async tests)
        run: python -m pytest tests/test_v2.py -v --tb=short -p no:asyncio

      - name: Run test_basic.py (skip async test)
        run: python -m pytest tests/test_basic.py -v --tb=short -k "not test_token_bucket" -p no:asyncio
