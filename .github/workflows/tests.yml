name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python --version
          pip --version

      - name: Install core deps one by one
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest pytest-asyncio

      - name: Install mcp
        run: pip install mcp || echo "mcp install failed, continuing"

      - name: Install project
        run: pip install -e . --no-deps || echo "project install failed, continuing"

      - name: List installed packages
        run: pip list | grep -iE "mcp|httpx|lxml|trafilatura|readability|pytest|beautifulsoup"

      - name: Try import test
        run: |
          python -c "import httpx; print('httpx ok')"
          python -c "import bs4; print('bs4 ok')"
          python -c "import lxml; print('lxml ok')"
          python -c "import trafilatura; print('trafilatura ok')" || echo "trafilatura import failed"
          python -c "import readability; print('readability ok')" || echo "readability import failed"
          python -c "import mcp; print('mcp ok')" || echo "mcp import failed"

      - name: Run tests
        run: pytest tests/ -v --tb=long 2>&1 | head -100
