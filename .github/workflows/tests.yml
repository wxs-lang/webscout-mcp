name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install pytest pytest-asyncio
          pip install mcp || true
          pip install -e . --no-deps

      - name: Show versions
        run: |
          python --version
          python -m pytest --version

      - name: Collect only
        run: python -m pytest tests/ --collect-only -q 2>&1 | head -60

      - name: Run tests with full output
        run: |
          set +e
          python -m pytest tests/ -v --tb=long > /tmp/test_output.txt 2>&1
          EXIT_CODE=$?
          echo "=== EXIT CODE: $EXIT_CODE ==="
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/test_output.txt
          echo "=== FIRST 30 LINES ==="
          head -30 /tmp/test_output.txt
          exit $EXIT_CODE
