name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install minimal deps
        run: |
          pip install pytest
          pip install -e . --no-deps

      - name: Test basic python
        run: python -c "print('python works'); import webscout_mcp; print('import works')"

      - name: Run single test
        run: python -m pytest tests/test_basic.py::TestConfig::test_defaults -v --tb=long
