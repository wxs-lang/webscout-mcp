name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Unit Tests - fast, no network, run on all Python versions
  # ============================================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-cov pytest-asyncio pytest-xdist anyio

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_mcp_e2e.py \
            --ignore=tests/test_mcp_live_e2e.py \
            --ignore=tests/test_fault_injection.py \
            --ignore=tests/test_integration.py \
            --ignore=tests/live \
            -v \
            --tb=short \
            -n auto \
            --junitxml=unit-test-results.xml \
            2>&1 | tee unit_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.python-version }}
          path: |
            unit-test-results.xml
            unit_test_output.txt
          retention-days: 7

  # ============================================================
  # Integration Tests - medium speed, may use local resources
  # ============================================================
  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py \
            -v \
            --tb=short \
            --junitxml=integration-test-results.xml \
            2>&1 | tee integration_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ matrix.python-version }}
          path: |
            integration-test-results.xml
            integration_test_output.txt
          retention-days: 7

  # ============================================================
  # MCP E2E Tests - slow, real stdio MCP protocol, dual matrix (MCP 1.x + 2.x)
  # ============================================================
  mcp-e2e-tests:
    name: MCP E2E Tests (MCP ${{ matrix.mcp-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.x", "2.x"]
        include:
          - mcp-version: "1.x"
            mcp-pin: "mcp>=1.0.0,<2.0.0"
          - mcp-version: "2.x"
            mcp-pin: "mcp>=2.0.0,<3.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (MCP ${{ matrix.mcp-version }})
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio "${{ matrix.mcp-pin }}"
          echo "Installed MCP version:"
          pip show mcp | grep Version

      - name: Run MCP E2E tests (no parallel)
        run: |
          python -m pytest tests/test_mcp_e2e.py \
            -v \
            --tb=long \
            --junitxml=mcp-e2e-test-results.xml \
            2>&1 | tee mcp_e2e_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload MCP E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-e2e-tests-mcp-${{ matrix.mcp-version }}
          path: |
            mcp-e2e-test-results.xml
            mcp_e2e_test_output.txt
          retention-days: 14

  # ============================================================
  # Fault Injection Tests - system-level fault scenarios
  # ============================================================
  fault-injection-tests:
    name: Fault Injection Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio

      - name: Run fault injection tests
        run: |
          python -m pytest tests/test_fault_injection.py \
            -v \
            --tb=short \
            --junitxml=fault-test-results.xml \
            2>&1 | tee fault_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload fault injection test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-injection-tests
          path: |
            fault-test-results.xml
            fault_test_output.txt
          retention-days: 14

  # ============================================================
  # Coverage - single Python, all tests except E2E
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-cov pytest-asyncio pytest-xdist anyio

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_mcp_e2e.py \
            --ignore=tests/test_mcp_live_e2e.py \
            --ignore=tests/test_fault_injection.py \
            --ignore=tests/test_system_fault_injection.py \
            --ignore=tests/test_integration.py \
            --ignore=tests/live \
            --tb=short \
            --cov=webscout_mcp \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            -n auto \
            2>&1 | tee coverage_output.txt
          exit ${PIPESTATUS[0]}

      - name: "Check minimum coverage (ratchet: can only stay same or go up)"
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import os

          # Parse current coverage
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0)) * 100
          print(f'Current line coverage: {line_rate:.1f}%')

          # Read baseline
          baseline_file = '.coverage-baseline'
          baseline = 62.0  # default minimum
          if os.path.exists(baseline_file):
              with open(baseline_file) as f:
                  for line in f:
                      if line.startswith('MINIMUM_LINE_COVERAGE='):
                          baseline = float(line.split('=')[1].strip())
                          break
          print(f'Baseline minimum: {baseline:.1f}%')

          # Ratchet check: coverage must not drop below baseline
          if line_rate < baseline:
              print(f'❌ FAILURE: Coverage {line_rate:.1f}% dropped below baseline {baseline:.1f}%')
              print('   Coverage ratchet prevents regression. Add more tests or fix failing tests.')
              exit(1)
          elif line_rate > baseline + 0.1:
              # Coverage improved - auto-update baseline (ratchet up)
              print(f'✅ Coverage improved from {baseline:.1f}% to {line_rate:.1f}%')
              print(f'   Auto-updating baseline to {line_rate:.1f}%')
              with open(baseline_file, 'w') as f:
                  f.write(f'# Coverage Baseline - auto-updated when coverage improves\n')
                  f.write(f'# This file enforces a \"ratchet\": coverage can only stay the same or go up\n')
                  f.write(f'# Format: MINIMUM_LINE_COVERAGE=<percentage>\n')
                  f.write(f'MINIMUM_LINE_COVERAGE={line_rate:.1f}\n')
              print(f'   Baseline updated to {line_rate:.1f}%')
          else:
              print(f'✅ Coverage {line_rate:.1f}% meets baseline {baseline:.1f}%')

          # Show per-module coverage for core modules
          print()
          print('=== Core Module Coverage ===')
          for package in root.findall('.//package'):
              name = package.get('name', '')
              if any(core in name for core in ['server', 'search_service', 'search_provider', 'provider_router', 'cache', 'config', 'errors', 'fetcher', 'startup_check']):
                  rate = float(package.get('line-rate', 0)) * 100
                  print(f'  {name}: {rate:.1f}%')
          "

      - name: Commit updated baseline (if coverage improved)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet .coverage-baseline; then
            echo "No baseline update needed"
          else
            echo "Baseline improved - committing update"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .coverage-baseline
            git commit -m "chore: auto-update coverage baseline (ratchet up)"
            git push
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            coverage_output.txt
          retention-days: 14
