name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml
          pip install trafilatura readability-lxml
          pip install "pytest<8" "pytest-asyncio<0.23"
          pip install mcp || true
          pip install -e . --no-deps

      - name: Run tests without async
        run: pytest tests/ -v --tb=long -k "not test_token_bucket"

      - name: Run async test alone
        run: pytest tests/test_basic.py::TestUtils::test_token_bucket -v --tb=long
