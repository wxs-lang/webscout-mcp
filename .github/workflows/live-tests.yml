name: Live Network Tests

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual run"

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live Network Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio

      - name: Run live search tests
        run: |
          set -o pipefail
          mkdir -p live-test-results
          python -m pytest tests/live/test_live_search.py \
            -v \
            --tb=short \
            --junitxml=live-test-results/live-search-results.xml \
            2>&1 | tee live-test-results/live-search-output.txt
          exit ${PIPESTATUS[0]}

      - name: Generate live test summary
        if: always()
        run: |
          echo "## Live Network Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f live-test-results/live_report.json ]; then
            cat live-test-results/live_report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated (tests may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Persist observability counters
        if: always()
        run: |
          # The content-quality counters live in process memory, so a run has to
          # leave a snapshot on disk or the SLO aggregator below sees no quality
          # data at all. This step makes the write explicit and deterministic
          # instead of relying on a process-exit hook firing in the pytest run.
          mkdir -p live-test-results
          python -m webscout_mcp metrics snapshot \
            --out live-test-results/live_report.json

      - name: A/B evaluation (pipeline vs bare baseline)
        if: always()
        continue-on-error: true
        run: |
          # Measures whether the pipeline actually returns more usable content
          # than a plain HTTP GET. This is the check whose 2026-10-23 result
          # (-7.3pp) drove the whole quality-metrics effort, and whose harness
          # was never committed, so it could not be repeated.
          #
          # continue-on-error: live-network variance must not turn the pipeline
          # red, but the verdict and the raw observations are uploaded below so
          # a FAIL is still visible and still re-scorable offline.
          mkdir -p ab-report
          python scripts/ab_evaluate.py \
            --limit 40 \
            --timeout 30 \
            --run-id "ab-${GITHUB_RUN_ID:-local}" \
            --out ab-report || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## A/B Evaluation (pipeline vs baseline)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ab-report/report.md ]; then
            cat ab-report/report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No A/B report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload A/B evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-evaluation
          path: |
            ab-report/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            live-test-results/
          retention-days: 90

      - name: Generate SLO report (7d/30d metrics)
        if: always()
        run: |
          set -o pipefail
          echo "Generating SLO report from historical live test data..."
          # NOTE: do NOT swallow errors here. The script itself exits 0 for
          # "no data yet" / warning states, and exits 1 for SLO violations or
          # code/data errors. A parse failure must turn this job red so we
          # never get a green CI with a silently broken monitoring pipeline.
          python scripts/slo_aggregator.py
          echo ""
          echo "## SLO Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Summary is generated by a real script (not an inline python -c
          # block) so YAML indentation can never break it again.
          python scripts/slo_dashboard_summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload SLO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-report
          path: |
            slo-reports/
          retention-days: 90


      # Note: Live test reports are stored as artifacts (90 days retention)
      # and summarized in the GitHub Actions run summary.
      # We do NOT push reports directly to main because:
      # 1. main is a protected branch
      # 2. main should only contain code and reviewed config, not daily monitoring data
      # 3. Historical data can be analyzed from artifacts or a dedicated dashboard
