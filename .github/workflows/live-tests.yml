name: Live Network Tests

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual run"

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live Network Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio

      - name: Run live search tests
        run: |
          mkdir -p live-test-results
          python -m pytest tests/live/test_live_search.py \
            -v \
            --tb=short \
            --run-live \
            --junitxml=live-test-results/live-search-results.xml \
            2>&1 | tee live-test-results/live-search-output.txt
          echo "Exit code: $?"

      - name: Generate live test summary
        if: always()
        run: |
          echo "## Live Network Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f live-test-results/live_report.json ]; then
            cat live-test-results/live_report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated (tests may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            live-test-results/
          retention-days: 90

      - name: Commit live test report
        if: always()
        run: |
          if [ -f live-test-results/live_report.json ]; then
            mkdir -p docs/live-test-reports
            cp live-test-results/live_report.json docs/live-test-reports/$(date -u '+%Y-%m-%d').json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/live-test-reports/
            git commit -m "docs: add live test report for $(date -u '+%Y-%m-%d')" || echo "No changes to commit"
            git push || echo "Push failed (may be protected branch)"
          fi
