name: Live Network Tests

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual run"

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live Network Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev,test]" || pip install -e .
          pip install pytest pytest-asyncio anyio

      - name: Run live search tests
        run: |
          set -o pipefail
          mkdir -p live-test-results
          python -m pytest tests/live/test_live_search.py \
            -v \
            --tb=short \
            --junitxml=live-test-results/live-search-results.xml \
            2>&1 | tee live-test-results/live-search-output.txt
          exit ${PIPESTATUS[0]}

      - name: Generate live test summary
        if: always()
        run: |
          echo "## Live Network Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f live-test-results/live_report.json ]; then
            cat live-test-results/live_report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated (tests may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Persist observability counters
        if: always()
        run: |
          # The content-quality counters live in process memory, so a run has to
          # leave a snapshot on disk or the SLO aggregator below sees no quality
          # data at all. This step makes the write explicit and deterministic
          # instead of relying on a process-exit hook firing in the pytest run.
          mkdir -p live-test-results
          python -m webscout_mcp metrics snapshot \
            --out live-test-results/live_report.json

      - name: A/B evaluation (pipeline vs bare baseline)
        if: always()
        continue-on-error: true
        run: |
          # Measures whether the pipeline actually returns more usable content
          # than a plain HTTP GET. This is the check whose 2026-10-23 result
          # (-7.3pp) drove the whole quality-metrics effort, and whose harness
          # was never committed, so it could not be repeated.
          #
          # continue-on-error: live-network variance must not turn the pipeline
          # red, but the verdict and the raw observations are uploaded below so
          # a FAIL is still visible and still re-scorable offline.
          mkdir -p ab-report
          python scripts/ab_evaluate.py \
            --limit 40 \
            --timeout 30 \
            --run-id "ab-${GITHUB_RUN_ID:-local}" \
            --out ab-report || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## A/B Evaluation (pipeline vs baseline)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ab-report/report.md ]; then
            cat ab-report/report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No A/B report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload A/B evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-evaluation
          path: |
            ab-report/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            live-test-results/
          retention-days: 90

      - name: Restore historical live reports
        if: always()
        # Each CI job starts from a fresh checkout, so without this the
        # aggregator only ever sees the current run and its "7d/30d windows" are
        # windows over a single sample - a rolling baseline can never
        # accumulate.
        #
        # Artifacts cannot be used here: actions/download-artifact@v4 fetches
        # artifacts from the *current* run only. Durable history lives on the
        # `slo-history` branch instead, one JSON file per run.
        continue-on-error: true
        run: |
          mkdir -p live-test-results/history
          if git ls-remote --exit-code --heads origin slo-history >/dev/null 2>&1; then
            git fetch --depth=1 origin slo-history
            # The branch stores runs/<id>/live_report.json, which is exactly the
            # shape the aggregator's **/live_report.json glob expects.
            git archive FETCH_HEAD | tar -x -C live-test-results/history
            echo "Restored history: $(find live-test-results/history -name live_report.json | wc -l) report(s)"
          else
            echo "No slo-history branch yet; this run starts the baseline."
          fi

      - name: Generate SLO report (7d/30d metrics)
        if: always()
        run: |
          set -o pipefail
          echo "Generating SLO report from historical live test data..."
          # NOTE: do NOT swallow errors here. The script itself exits 0 for
          # "no data yet" / warning states, and exits 1 for SLO violations or
          # code/data errors. A parse failure must turn this job red so we
          # never get a green CI with a silently broken monitoring pipeline.
          python scripts/slo_aggregator.py
          echo ""
          echo "## SLO Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Summary is generated by a real script (not an inline python -c
          # block) so YAML indentation can never break it again.
          python scripts/slo_dashboard_summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload SLO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-report
          path: |
            slo-reports/
          retention-days: 90

      - name: Append this run to slo-history
        if: always()
        # The rolling window needs durable history, and artifacts expire and are
        # per-run. A dedicated orphan branch keeps one small JSON per run:
        # committed by CI, never merged, so it does not pollute main.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=live-test-results/live_report.json
          if [ ! -f "$REPORT" ]; then
            echo "No live_report.json produced; nothing to record."
            exit 0
          fi

          STAMP=$(date -u '+%Y%m%dT%H%M%SZ')
          RUNKEY="${GITHUB_RUN_ID:-local}-${STAMP}"

          WORK=$(mktemp -d)
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          if git ls-remote --exit-code --heads origin slo-history >/dev/null 2>&1; then
            git clone --depth=1 --branch slo-history "https://github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            # Orphan branch: no shared history with main, so it can hold data
            # without ever being merged.
            git init "$WORK"
            cd "$WORK"
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git checkout --orphan slo-history
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$WORK"
          # Layout matters: the aggregator globs for files literally named
          # live_report.json, so each run lives in its own directory. A flat
          # runs/<id>.json would be invisible to it.
          mkdir -p "runs/${RUNKEY}"
          cp "$GITHUB_WORKSPACE/$REPORT" "runs/${RUNKEY}/live_report.json"
          git add runs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "slo-history: ${RUNKEY}"
          git push origin slo-history
          echo "Recorded runs/${RUNKEY}/live_report.json ($(ls -1d runs/*/ | wc -l) run(s) total)"

      # Note: per-run reports are also uploaded as artifacts (90 days), but the
      # SLO rolling window reads the `slo-history` branch because artifacts are
      # per-run and expire.
      # We do NOT push reports to main because:
      # 1. main is a protected branch
      # 2. main should hold code and reviewed config, not daily monitoring data
      # 3. an orphan branch keeps the data without ever being merged
