name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools-scm

      - name: Build wheel (with full Git metadata for setuptools-scm)
        run: |
          python -m build --wheel --outdir dist/
          echo "Built wheels:"
          ls -la dist/*.whl
          echo "Wheel version:"
          python -c "import zipfile,glob; w=glob.glob('dist/*.whl')[0]; print(w.split('/')[-1])"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  runtime-smoke:
    name: Docker runtime smoke (build + run + 11 tools)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and build wheel (Dockerfile expects dist/*.whl)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel --outdir dist/

      - name: Build local image (amd64, no push)
        run: |
          docker build -t webscout-runtime-smoke:local .
          docker images webscout-runtime-smoke:local

      - name: Container starts and package imports
        run: |
          docker run --rm --entrypoint python webscout-runtime-smoke:local -m webscout_mcp --help

      - name: Container creates MCP server and registers 11 tools
        run: |
          docker run --rm --entrypoint python webscout-runtime-smoke:local -c "
          import asyncio
          from webscout_mcp.config import Config
          from webscout_mcp.server import create_server
          mcp = create_server(Config())
          async def count():
            tools = await mcp.list_tools()
            return len(tools)
          n = asyncio.run(count())
          print('MCP tools registered in container:', n)
          assert n == 11, f'expected 11 tools, got {n}'
          print('RUNTIME SMOKE OK')
          "
        env:
          # No TypeSafe SDK, no Jev key: core image must start clean.
          JEV_ENABLED: "false"
