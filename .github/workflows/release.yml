name: Automated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.1.4)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no release created)'
        required: false
        default: false
        type: boolean

# NOTE: Auto-release on push to main has been DISABLED.
# Version is now managed by setuptools-scm (Git tag as single source of truth).
# To release: manually trigger this workflow with the desired version number.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  check-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version format
        id: check
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Requested version: $VERSION"

          # Validate semver format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: $VERSION (must be X.Y.Z)"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Version $VERSION is valid"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT

  quality-gate:
    name: Quality Gate (verify required checks)
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Wait for required checks to complete
        id: wait_checks
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          echo "Checking required status checks for commit $SHA..."
          echo ""

          # Required checks that must pass (matches branch protection rules)
          REQUIRED_CHECKS=(
            "Unit Tests (Python 3.10)"
            "Unit Tests (Python 3.11)"
            "Unit Tests (Python 3.12)"
            "Integration Tests (Python 3.10)"
            "Integration Tests (Python 3.11)"
            "Integration Tests (Python 3.12)"
            "MCP E2E Tests (MCP 1.x)"
            "MCP E2E Tests (MCP 2.x)"
            "Fault Injection Tests"
            "Lint (ruff)"
            "Security Scan (bandit)"
            "CodeQL Analysis (python)"
            "Type Check (mypy)"
            "build-and-push"
          )

          # Poll for up to 10 minutes
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          ALL_PASSED=false

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."

            # Get all check runs for this commit
            RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"               -H "Accept: application/vnd.github.v3+json"               "https://api.github.com/repos/$REPO/commits/$SHA/check-runs?per_page=100")

            ALL_COMPLETED=true
            FAILED_CHECKS=()
            PENDING_CHECKS=()

            for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
              STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          target = '$CHECK_NAME'
          for run in data.get('check_runs', []):
              if run['name'] == target:
                  print(f\"{run['status']}:{run.get('conclusion', 'none')}\")
                  sys.exit(0)
          print('not_found:none')
          ")
              STATUS_VAL=$(echo "$STATUS" | cut -d: -f1)
              CONCLUSION=$(echo "$STATUS" | cut -d: -f2)

              if [ "$STATUS_VAL" = "not_found" ]; then
                PENDING_CHECKS+=("$CHECK_NAME (not started)")
                ALL_COMPLETED=false
              elif [ "$STATUS_VAL" != "completed" ]; then
                PENDING_CHECKS+=("$CHECK_NAME ($STATUS_VAL)")
                ALL_COMPLETED=false
              elif [ "$CONCLUSION" != "success" ]; then
                FAILED_CHECKS+=("$CHECK_NAME ($CONCLUSION)")
              fi
            done

            if [ ${#FAILED_CHECKS[@]} -gt 0 ]; then
              echo "❌ Failed checks:"
              for check in "${FAILED_CHECKS[@]}"; do
                echo "   - $check"
              done
              echo ""
              echo "Quality gate FAILED. Required checks did not pass."
              exit 1
            fi

            if [ "$ALL_COMPLETED" = true ]; then
              echo "✅ All required checks passed!"
              for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
                echo "   - $CHECK_NAME: success"
              done
              ALL_PASSED=true
              break
            fi

            echo "Pending checks:"
            for check in "${PENDING_CHECKS[@]}"; do
              echo "   - $check"
            done
            echo ""
            echo "Waiting $SLEEP_SECONDS seconds..."
            sleep $SLEEP_SECONDS
          done

          if [ "$ALL_PASSED" != true ]; then
            echo "❌ Timeout waiting for required checks to complete."
            echo "Quality gate FAILED."
            exit 1
          fi

          echo ""
          echo "## ✅ Quality Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required status checks passed for commit \`$SHA\`:" >> $GITHUB_STEP_SUMMARY
          for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
            echo "- $CHECK_NAME: ✅" >> $GITHUB_STEP_SUMMARY
          done

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check-version, quality-gate]
    if: needs.check-version.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate release notes
        id: release_notes
        run: |
          NEW_VERSION="${{ needs.check-version.outputs.new_version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "## 🎉 Release v$NEW_VERSION" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 What's Changed" >> release_notes.md
          echo "" >> release_notes.md

          if [ -n "$LATEST_TAG" ]; then
            git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### 📝 Full Changelog" >> release_notes.md
          echo "" >> release_notes.md
          echo "https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v$NEW_VERSION" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "pip install webscout-mcp==$NEW_VERSION" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

          cat release_notes.md

      - name: Create tag
        run: |
          NEW_VERSION="${{ needs.check-version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Release v${{ needs.check-version.outputs.new_version }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          NEW_VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "## 🎉 Release v$NEW_VERSION Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v$NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: v$NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/v$NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI**: https://pypi.org/project/webscout-mcp/$NEW_VERSION/" >> $GITHUB_STEP_SUMMARY
