# Pre-commit hooks for webscout-mcp
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML files
      - id: check-json
        name: Check JSON files
      - id: check-toml
        name: Check TOML files
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-docstring-first
        name: Check docstring is first
      - id: debug-statements
        name: Debug statements (Python)
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Mixed line ending
        args: ['--fix=lf']
      - id: name-tests-test
        name: Python tests naming
        args: ['--pytest-test-first']
      - id: requirements-txt-fixer
        name: Fix requirements.txt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix, --exit-zero]
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        name: Mypy type check
        additional_dependencies:
          - types-requests
          - types-PyYAML
        args: [--ignore-missing-imports, --exit-zero]
        files: ^webscout_mcp/
        pass_filenames: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit security scan
        args: [-ll, --exit-zero]
        files: ^webscout_mcp/
        pass_filenames: true

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        name: Codespell
        additional_dependencies:
          - tomli
        args: ["--skip=*.ipynb,*.lock,*.svg,*.png,*.jpg,*.gif,*.pdf,*.ico,*.woff,*.woff2,*.ttf,*.eot,*.map,*.min.js,*.min.css"]
        types_or: [python, markdown, rst, json, yaml, toml]

  - repo: https://github.com/hadialqattan/pycln
    rev: v2.4.0
    hooks:
      - id: pycln
        name: Pycln (remove unused imports)
        args: [--all]
        files: ^webscout_mcp/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck
        files: \.sh$

  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        args: [tests/, -x, -q, --tb=short]
        stages: [manual]

      - id: pytest-cov
        name: Run tests with coverage
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        args: [tests/, --cov=webscout_mcp, --cov-report=term-missing, -q]
        stages: [manual]

# Configuration
default_stages: [commit]
fail_fast: false
minimum_pre_commit_version: 3.0.0
