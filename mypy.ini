[mypy]
# MyPy configuration for webscout-mcp
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
strict_optional = False
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
show_column_numbers = True
color_output = True
error_summary = True

# Exclude test files from strict checking
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Exclude example files
[mypy-examples.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Exclude scripts
[mypy-scripts.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Modules with known issues (temporarily relaxed)
[mypy-webscout_mcp.api_server]
disallow_untyped_defs = False

[mypy-webscout_mcp.__main__]
disallow_untyped_defs = False

[mypy-webscout_mcp.server]
disallow_untyped_defs = False

[mypy-webscout_mcp.browser_fetcher]
disallow_untyped_defs = False

[mypy-webscout_mcp.crawler]
disallow_untyped_defs = False

[mypy-webscout_mcp.monitor]
disallow_untyped_defs = False

[mypy-webscout_mcp.plugin_system]
disallow_untyped_defs = False
